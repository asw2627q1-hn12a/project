<%
require "uri"
production_urls = { "primary" => ENV["DATABASE_URL"] }
%w[cache queue cable].each do |name|
  url = ENV["#{name.upcase}_DATABASE_URL"]
  if url.blank? && ENV["DATABASE_URL"].to_s.match?(%r{\Apostgres(?:ql)?://})
    uri = URI.parse(ENV["DATABASE_URL"])
    uri.path = "#{uri.path}_#{name}"
    url = uri.to_s
  end
  production_urls[name] = url
end
%>
# SQLite locally; DATABASE_URL can select PostgreSQL for tests.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# All production databases live on the external PostgreSQL server.
# Auxiliary URLs default to the primary database name plus their suffix.
production:
  primary: &production
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    url: <%= production_urls["primary"].to_json %>
    seeds: false
  cache:
    <<: *production
    url: <%= production_urls["cache"].to_json %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *production
    url: <%= production_urls["queue"].to_json %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *production
    url: <%= production_urls["cable"].to_json %>
    migrations_paths: db/cable_migrate
